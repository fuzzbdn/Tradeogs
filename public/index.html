<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradeogs</title>
    <link rel="stylesheet" href="/style.css">
    
    </head>
<body>

    <div class="login-card">
        <img src="/tradeogs_logo.png" alt="Tradeogs Logo" class="login-logo">
        <h2>Logga in på ditt konto</h2>

        <div class="form-group">
            <label for="email">E-postadress</label>
            <input type="email" id="email" placeholder="namn@domän.com">
        </div>
        <div class="form-group">
            <label for="password">Lösenord</label>
            <input type="password" id="password" placeholder="Ditt lösenord">
        </div>

        <button class="btn btn-primary" onclick="loginUser()">Logga in</button>
        <a href="/register.html" class="btn btn-outline">Skapa ett nytt konto</a>

        <div class="divider">eller</div>
        <a href="/api/auth/google" class="btn btn-google">Fortsätt med Google</a>

        <div id="status-message" class="message"></div>
    </div>

    <script>
        async function loginUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('status-message');

            if (!email || !password) {
                statusDiv.style.color = '#ff4757';
                statusDiv.innerText = 'Vänligen fyll i både e-post och lösenord.';
                return;
            }

            statusDiv.style.color = '#666';
            statusDiv.innerText = 'Loggar in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Något gick fel vid inloggningen.');
                }

                localStorage.setItem('supabase_session', JSON.stringify(result.session));
                window.location.href = '/dashboard.html';

            } catch (error) {
                statusDiv.style.color = '#ff4757';
                statusDiv.innerText = error.message;
            }
        }
    </script>
</body>
</html>
