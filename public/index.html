<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradeogs - Logga in</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100vw; min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-card {
            background: #1e1e1e; padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center;
            width: 100%; max-width: 400px;
        }
        h1 { margin-bottom: 20px; letter-spacing: 2px; color: #ffffff; }
        h2 { font-size: 18px; color: #aaa; margin-bottom: 30px; font-weight: normal; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333;
            background-color: #252525; color: white; font-size: 16px;
        }
        input:focus { border-color: #4285F4; outline: none; }

        .btn {
            display: block; width: 100%; color: white; border: none;
            padding: 12px; margin: 10px 0; font-size: 16px; font-weight: bold;
            border-radius: 6px; cursor: pointer; text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background-color: #4285F4; }
        .btn-secondary { background-color: #333333; border: 1px solid #555; }
        .btn-google { background-color: #ffffff; color: #000000; margin-top: 25px; }
        
        .divider { margin: 20px 0; color: #555; position: relative; }
        .message { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>TRADEOGS</h1>
        <h2>Logga in eller skapa ett konto</h2>

        <div class="form-group">
            <label for="email">E-postadress</label>
            <input type="email" id="email" placeholder="namn@domän.com">
        </div>
        <div class="form-group">
            <label for="password">Lösenord</label>
            <input type="password" id="password" placeholder="Minst 6 tecken">
        </div>

        <button class="btn btn-primary" onclick="handleAuth('/api/auth/login')">Logga in</button>
        <button class="btn btn-secondary" onclick="handleAuth('/api/auth/register')">Skapa konto</button>

        <div class="divider">eller</div>

        <a href="/api/auth/google" class="btn btn-google">Fortsätt med Google</a>

        <div id="status-message" class="message"></div>
    </div>

    <script>
        async function handleAuth(endpoint) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('status-message');

            if (!email || !password) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Vänligen fyll i både e-post och lösenord.';
                return;
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Något gick fel.');
                }

                if (endpoint.includes('register')) {
                    statusDiv.style.color = '#51cf66';
                    statusDiv.innerText = result.message; // "Registrering lyckades! Kontrollera din e-post."
                } else {
                    // Inloggning lyckades! Spara sessionen lokalt och skicka vidare till dashboarden
                    localStorage.setItem('supabase_session', JSON.stringify(result.session));
                    window.location.href = '/dashboard.html';
                }

            } catch (error) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = error.message;
            }
        }
    </script>
</body>
</html>
