<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradeogs - Logga in</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100vw; min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-card {
            background: #1e1e1e; padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center;
            width: 100%; max-width: 400px;
        }
        
        /* NY CSS FÖR LOGGAN PÅ INLOGGNINGSSIDAN */
        .login-logo {
            width: 100%; 
            max-width: 300px; /* Håller den i en bra storlek för kortet */
            height: auto; 
            margin-bottom: 20px;
        }

        h2 { font-size: 18px; color: #aaa; margin-bottom: 30px; font-weight: normal; margin-top: 0; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333;
            background-color: #252525; color: white; font-size: 16px;
        }
        input:focus { border-color: #4285F4; outline: none; }

        .btn {
            display: block; width: 100%; color: white; border: none;
            padding: 12px; margin: 10px 0; font-size: 16px; font-weight: bold;
            border-radius: 6px; cursor: pointer; text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background-color: #4285F4; }
        
        .btn-outline { background-color: transparent; border: 1px solid #555; color: #fff; }
        .btn-outline:hover { border-color: #fff; }
        
        .btn-google { background-color: #ffffff; color: #000000; margin-top: 25px; }
        
        .divider { margin: 20px 0; color: #555; position: relative; font-size: 14px; }
        .message { margin-top: 15px; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="/tradeogs_logo.png" alt="Tradeogs Logo" class="login-logo">
        
        <h2>Logga in på ditt konto</h2>

        <div class="form-group">
            <label for="email">E-postadress</label>
            <input type="email" id="email" placeholder="namn@domän.com">
        </div>
        <div class="form-group">
            <label for="password">Lösenord</label>
            <input type="password" id="password" placeholder="Ditt lösenord">
        </div>

        <button class="btn btn-primary" onclick="loginUser()">Logga in</button>
        <a href="/register.html" class="btn btn-outline">Skapa ett nytt konto</a>

        <div class="divider">eller</div>
        <a href="/api/auth/google" class="btn btn-google">Fortsätt med Google</a>

        <div id="status-message" class="message"></div>
    </div>

    <script>
        async function loginUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('status-message');

            if (!email || !password) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Vänligen fyll i både e-post och lösenord.';
                return;
            }

            statusDiv.style.color = '#aaa';
            statusDiv.innerText = 'Loggar in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Något gick fel vid inloggningen.');
                }

                localStorage.setItem('supabase_session', JSON.stringify(result.session));
                window.location.href = '/dashboard.html';

            } catch (error) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = error.message;
            }
        }
    </script>
</body>
</html>
