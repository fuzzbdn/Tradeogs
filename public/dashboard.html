<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradeogs - Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100vw; min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; color: #ffffff;
            display: flex; flex-direction: column; align-items: center;
        }
        header {
            width: 100%; background-color: #1e1e1e; padding: 20px 0;
            text-align: center; border-bottom: 2px solid #333;
            display: flex; justify-content: space-around; align-items: center;
        }
        h1 { margin: 0; letter-spacing: 2px; }
        .logout-btn {
            background: none; border: 1px solid #ff6b6b; color: #ff6b6b;
            padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .logout-btn:hover { background: #ff6b6b; color: white; }
        
        .container {
            width: 100%; max-width: 800px; padding: 40px 20px;
            display: flex; flex-direction: column; gap: 30px; flex-grow: 1;
        }
        .card {
            background: #1e1e1e; padding: 30px; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center;
        }
        .card h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .btn {
            display: inline-block; color: white; border: none;
            padding: 12px 24px; margin: 10px; font-size: 16px;
            font-weight: bold; border-radius: 6px; cursor: pointer;
            text-decoration: none; transition: opacity 0.2s, transform 0.1s;
        }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }
        .btn-discogs { background-color: #333333; border: 1px solid #555; }
        .btn-tradera { background-color: #fbd914; color: #121212; }
    </style>

    <script>
        (function() {
            // 1. Kolla om det finns en sparad session från e-postinloggningen
            let session = localStorage.getItem('supabase_session');

            // 2. Förberedelse för Google: Kolla om vi precis kom tillbaka från Google OAuth.
            // Supabase skickar nämligen med inloggningsnycklarna efter ett '#' i adressfältet.
            if (window.location.hash) {
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);
                const accessToken = params.get('access_token');
                const refreshToken = params.get('refresh_token');

                if (accessToken) {
                    const oauthSession = {
                        access_token: accessToken,
                        refresh_token: refreshToken
                    };
                    // Sparar Google-sessionen så den fungerar på samma sätt som e-post
                    localStorage.setItem('supabase_session', JSON.stringify(oauthSession));
                    session = JSON.stringify(oauthSession);
                    
                    // Rensa bort den fula texten ur adressfältet så det bara står /dashboard.html
                    history.replaceState(null, null, window.location.pathname);
                }
            }

            // 3. Om ingen session hittades överhuvudtaget -> Kasta ut till inloggningssidan!
            if (!session) {
                window.location.href = '/index.html';
            }
        })();
    </script>
</head>
<body>

    <header>
        <div></div> <h1>TRADEOGS</h1>
        <button class="logout-btn" onclick="logout()">Logga ut</button>
    </header>

    <div class="container">
        <div class="card">
            <h2>Koppla dina plattformar</h2>
            <p>Auktorisera Tradeogs att hämta dina skivor och lägga upp annonser.</p>
            <a href="/api/auth/discogs/login" class="btn btn-discogs">Koppla Discogs</a>
            <a href="/api/tradera/login" class="btn btn-tradera">Koppla Tradera</a>
        </div>
    </div>

    <script>
        function logout() {
            // Rensa sparad data och skicka tillbaka till inloggningen
            localStorage.removeItem('supabase_session');
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
