<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradeogs</title>
    <link rel="stylesheet" href="/style.css">
    
    </head>
<body>

    <div class="login-card">
        <h1>Skapa konto</h1>
        <h2>Börja hantera dina skivor idag</h2>

        <div class="form-group">
            <label for="email">E-post (Användarnamn)</label>
            <input type="email" id="email" placeholder="namn@domän.com" required>
        </div>
        <div class="form-group">
            <label for="password">Lösenord</label>
            <input type="password" id="password" placeholder="Minst 6 tecken" required>
        </div>
        <div class="form-group">
            <label for="confirm-password">Bekräfta lösenord</label>
            <input type="password" id="confirm-password" placeholder="Skriv lösenordet igen" required>
        </div>

        <button class="btn" onclick="registerUser()">Registrera dig</button>
        
        <a href="/index.html" class="back-link">← Har du redan ett konto? Logga in</a>

        <div id="status-message" class="message"></div>
    </div>

    <script>
        async function registerUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const statusDiv = document.getElementById('status-message');

            // Grundläggande validering
            if (!email || !password || !confirmPassword) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Vänligen fyll i alla fält.';
                return;
            }

            if (password !== confirmPassword) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Lösenorden matchar inte varandra.';
                return;
            }

            if (password.length < 6) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Lösenordet måste vara minst 6 tecken långt.';
                return;
            }

            statusDiv.style.color = '#aaa';
            statusDiv.innerText = 'Skapar konto...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Något gick fel.');
                }

                // Om inloggning sker automatiskt efter registrering sparar vi sessionen
                if (result.session) {
                    localStorage.setItem('supabase_session', JSON.stringify(result.session));
                }

                statusDiv.style.color = '#51cf66';
                statusDiv.innerText = 'Konto skapat! Skickar dig vidare...';
                
                // Vänta en sekund så användaren hinner läsa, skicka sedan till dashboard
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1500);

            } catch (error) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = error.message;
            }
        }
    </script>
</body>
</html>
