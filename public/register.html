<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradeogs - Skapa konto</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100vw; min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-card {
            background: #1e1e1e; padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center;
            width: 100%; max-width: 450px;
        }
        h1 { margin-bottom: 10px; letter-spacing: 2px; color: #ffffff; }
        h2 { font-size: 16px; color: #aaa; margin-bottom: 30px; font-weight: normal; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        input {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333;
            background-color: #252525; color: white; font-size: 16px;
        }
        input:focus { border-color: #51cf66; outline: none; }

        .btn {
            display: block; width: 100%; color: white; border: none;
            padding: 14px; margin: 25px 0 15px 0; font-size: 16px; font-weight: bold;
            border-radius: 6px; cursor: pointer; text-decoration: none;
            transition: opacity 0.2s; background-color: #51cf66;
        }
        .btn:hover { opacity: 0.9; }
        
        .back-link { color: #aaa; text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .back-link:hover { color: #ffffff; }

        .message { margin-top: 15px; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Skapa konto</h1>
        <h2>Börja hantera dina skivor idag</h2>

        <div class="form-group">
            <label for="email">E-post (Användarnamn)</label>
            <input type="email" id="email" placeholder="namn@domän.com" required>
        </div>
        <div class="form-group">
            <label for="password">Lösenord</label>
            <input type="password" id="password" placeholder="Minst 6 tecken" required>
        </div>
        <div class="form-group">
            <label for="confirm-password">Bekräfta lösenord</label>
            <input type="password" id="confirm-password" placeholder="Skriv lösenordet igen" required>
        </div>

        <button class="btn" onclick="registerUser()">Registrera dig</button>
        
        <a href="/index.html" class="back-link">← Har du redan ett konto? Logga in</a>

        <div id="status-message" class="message"></div>
    </div>

    <script>
        async function registerUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const statusDiv = document.getElementById('status-message');

            // Grundläggande validering
            if (!email || !password || !confirmPassword) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Vänligen fyll i alla fält.';
                return;
            }

            if (password !== confirmPassword) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Lösenorden matchar inte varandra.';
                return;
            }

            if (password.length < 6) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Lösenordet måste vara minst 6 tecken långt.';
                return;
            }

            statusDiv.style.color = '#aaa';
            statusDiv.innerText = 'Skapar konto...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Något gick fel.');
                }

                // Om inloggning sker automatiskt efter registrering sparar vi sessionen
                if (result.session) {
                    localStorage.setItem('supabase_session', JSON.stringify(result.session));
                }

                statusDiv.style.color = '#51cf66';
                statusDiv.innerText = 'Konto skapat! Skickar dig vidare...';
                
                // Vänta en sekund så användaren hinner läsa, skicka sedan till dashboard
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1500);

            } catch (error) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = error.message;
            }
        }
    </script>
</body>
</html>
